[package]
name = "cloud-deck"
version = "0.1.3"
description = "Cloud Deck desktop client"
edition = "2021"

[lib]
name = "cloud_deck"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
native-smoke = ["dep:objc2-app-kit", "dep:objc2-foundation", "dep:objc2-web-kit", "dep:block2"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync", "net", "io-util"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
russh = { version = "0.65.1", default-features = false, features = ["ring"] }
url = "2"
base64 = "0.22"
sha2 = "0.10"
subtle = "2"
getrandom = "0.3"
jsonwebtoken = "9"
tiny_http = "0.12"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = ["NSBitmapImageRep", "NSImage"] }
objc2-foundation = { version = "0.3", optional = true, features = ["NSData", "NSDictionary", "NSError"] }
objc2-web-kit = { version = "0.3", optional = true, features = ["WKSnapshotConfiguration", "WKWebView", "block2"] }
