function alertBanner(){if(scenario==='disconnected')return `<div class="inline-alert">${icons('alert')}<div><b>连接中断，机器状态待确认</b><p>云端可能仍在运行。客户端正在重连，计费状态尚未更新。</p></div><button class="quiet" data-action="reconnect">重新连接</button></div>`;if(scenario==='failed')return `<div class="inline-alert bad" role="alert">${icons('alert')}<div><b>H100 申请失败 · HTTP 503</b><p>Colab 暂时无法完成请求，具体原因未确认。错误会保留在活动记录。</p></div><button class="quiet" data-page="logs">查看详情</button></div>`;if(scenario==='sync-failed')return `<div class="inline-alert bad" role="alert">${icons('alert')}<div><b>2 个文件未能保存，已中止关机</b><p>实例保持运行并继续计费。修复同步后再释放实例。</p></div><button class="quiet" data-action="retry-sync">重试同步</button></div>`;if(scenario==='starting')return `<div class="inline-alert" style="color:var(--accent);background:var(--accent-soft);border-color:#dedaf3"><span class="loading-dot"></span><div><b>正在准备已启用的应用</b><p>实例已分配 → 云盘已连接 → 恢复环境与文件 → 应用健康检查</p></div><button class="quiet" data-action="finish-boot">演示完成</button></div>`;return ''}
function appRow(a){const custom=a.id!=='comfyui',ready=cfg().ready&&!appStopped&&!custom;return `<div class="app-row"><div class="app-logo ${custom?'neutral':''}">${icons(a.icon)}</div><div class="grow"><div class="row" style="gap:8px"><h3>${esc(a.name)}</h3>${badge(ready?'运行中':custom?'已配置':scenario==='off'?'待启动':appStopped?'已停止':'待就绪',ready?'good':'')}</div><p>${esc(a.subtitle)}${!custom?' · 随工作站启动':''}</p></div><button class="btn" data-action="${custom?'custom-info':'open-app'}" data-app="${esc(a.id)}" ${!ready&&!custom?'disabled':''}>${custom?'配置':'打开'}${icons(custom?'settings':'arrow')}</button>${!custom?`<button class="quiet" data-page="detail" aria-label="ComfyUI 详情" style="padding:0 2px">${icons('chevron')}</button>`:''}</div>`}
function home(){const c=cfg(),offline=scenario==='off'||scenario==='failed';return `${alertBanner()}<div class="overview"><div class="primary-column"><section class="card machine" aria-label="实例管理"><div class="machine-inner"><div class="machine-head"><div class="caption">${icons('cloud')}GOOGLE COLAB<span style="margin:0 3px;color:#ccd1dd">/</span>我的工作站</div>${badge(c.label,c.kind)}</div><div class="machine-main"><div class="gpu-visual" aria-hidden="true"><svg viewBox="0 0 80 80"><rect x="13" y="13" width="54" height="54" rx="12" fill="#f3f1fb" stroke="#d3cdea"/><rect x="22" y="22" width="36" height="36" rx="7" stroke="#a59bc9"/><path d="M26 7v6m14-6v6m14-6v6M26 67v6m14-6v6m14-6v6M7 26h6M7 40h6M7 54h6M67 26h6M67 40h6M67 54h6" stroke="#b8b1d4"/></svg><b>${c.gpu}</b></div><div class="grow"><div class="gpu-name">${c.gpu} GPU 工作站</div><p class="gpu-spec">${c.gpu==='G4'?'NVIDIA RTX PRO 6000 Blackwell':'GPU 型号与配置以实际分配结果为准'}</p><div class="gpu-meta"><span class="pill">${c.gpu==='G4'?'96 GB 显存':'显存待分配确认'}</span><span class="pill">${icons('pin')}${offline?'地区待分配':scenario==='disconnected'?'新加坡 · 上次记录':'新加坡'}</span></div></div></div><dl class="machine-details"><div><dt>${offline?'运行环境':'系统内存'}</dt><dd>${offline?'Ubuntu Linux':'176'}${offline?'':' <small>GiB</small>'}</dd></div><div><dt>${offline?'运行时长':'本次已运行'}</dt><dd class="num">${offline?'—':'00:28:16'}</dd></div><div><dt>当前计费</dt><dd class="num">${c.rate} <small>点 / 小时</small></dd></div></dl></div><div class="machine-actions"><p>${offline?'开机后自动恢复已启用的应用和文件。':'关闭客户端不会停止云端计费。'}</p><div class="row" style="gap:8px">${offline?`<label class="sr-only" for="gpu-select">下次启动的 GPU</label><select id="gpu-select" class="btn">${['G4','H100','A100','L4','T4'].map(g=>`<option ${g===selectedGPU?'selected':''}>${g}</option>`).join('')}</select><button class="btn primary" data-action="boot">${icons('power')}启动工作站</button>`:scenario==='disconnected'?`<button class="btn" data-action="reconnect">${icons('refresh')}重新连接</button>`:`<button class="btn" data-action="stop">${icons('power')}同步并关机</button>`}</div></div></section><section class="installed"><div class="section-title"><h2>已添加应用 <span class="muted tiny" style="font-weight:400;margin-left:5px">${demo.apps.length+customApps.length}</span></h2><button class="text-button" data-page="apps">管理应用${icons('chevron')}</button></div><div class="installed-list">${[...demo.apps,...customApps].map(appRow).join('')}<button class="dashed-row" data-action="add">${icons('plus')}添加应用，扩展这台工作站的用途<span class="grow"></span>${icons('chevron')}</button></div></section></div><aside class="context-column"><section class="card context-card"><div class="between"><h3>可用计算点数</h3><span class="pill">Ultra</span></div><div class="credit-value num">2,464.57<small>点</small></div><p>用量以 Colab 返回的结果为准</p><div class="context-divider"></div><div class="source-tag">${icons('cloud')}Google Colab<span class="grow"></span><span style="font-size:10px">演示余额</span></div></section><section class="card context-card"><div class="between"><h3>文件保护</h3><button class="quiet" data-page="files" aria-label="查看文件同步" style="min-height:20px;padding:0">${icons('chevron')}</button></div><div class="sync-summary"><div class="sync-symbol" style="${scenario==='sync-failed'?'background:var(--bad-soft);color:var(--bad)':''}">${icons(scenario==='sync-failed'?'alert':'check')}</div><div><strong>${scenario==='sync-failed'?'2 个文件待重试':offline?'已保存上次快照':'已同步到云盘'}</strong><small>${offline?'开机后重新扫描':'最近同步 10:42 · 演示'}</small></div></div><p>工作流、输入和生成结果，按应用分别保存。</p><button class="text-button" data-page="files" style="margin-top:8px;font-size:11px">管理同步规则${icons('chevron')}</button></section><section class="card context-card"><h3>访问连接</h3><div class="connection-lines"><div class="between"><span class="muted">客户端连接</span><span>${c.connection}</span></div><div class="between"><span class="muted">应用入口</span><span>${c.ready?'自动建立':'等待就绪'}</span></div></div></section><div class="footnote">${icons('shield')}<span>连接与重连由客户端管理，打开应用即可使用。</span></div></aside></div><div class="activity-strip">${icons('log')}<span class="mono">10:42:08</span><span>${scenario==='failed'?'H100 申请返回 HTTP 503 · 错误已保留':scenario==='sync-failed'?'同步失败 · 关机已中止，实例仍在运行':scenario==='disconnected'?'连接中断 · 正在重新确认实例状态':'工作站状态、应用与文件同步分别记录'}</span><button class="text-button" data-page="logs">全部记录${icons('chevron')}</button></div>`}
function apps(){return `<div class="tabs" role="tablist" aria-label="应用分类"><button role="tab" data-tab="installed" aria-selected="${appTab==='installed'}">我的应用 <span class="tiny">${demo.apps.length+customApps.length}</span></button><button role="tab" data-tab="templates" aria-selected="${appTab==='templates'}">添加应用</button></div><div class="scroll-area" role="tabpanel">${appTab==='installed'?`${[...demo.apps,...customApps].map(appRow).join('')}<div class="hint-panel">${icons('apps')}<div class="grow"><h3>ComfyUI 是开始，还有更多可能。</h3><p>添加 Python 任务或自定义 Web 服务，复用同一台 GPU 工作站。</p></div><button class="btn" data-tab="templates">浏览模板${icons('chevron')}</button></div>`:`<div class="catalog"><article class="card template-card"><div class="app-logo">${icons('node')}</div><h3>ComfyUI</h3><p>节点式图像与视频创作，恢复插件、模型和工作流。</p><div class="tags"><span>图像生成</span><span>自动恢复</span></div><button class="btn" data-page="detail">已添加 · 查看应用${icons('chevron')}</button></article><article class="card template-card"><div class="app-logo neutral">${icons('code')}</div><h3>Python 任务</h3><p>运行你的 Python 脚本，查看执行进度并保存任务产物。</p><div class="tags"><span>脚本运行</span><span>任务产物</span></div><button class="btn" data-action="add-python">使用模板${icons('plus')}</button></article><article class="card template-card"><div class="app-logo neutral">${icons('service')}</div><h3>自定义服务</h3><p>提供启动命令、访问端口和保存目录，接入自己的应用。</p><div class="tags"><span>Web 服务</span><span>自定义环境</span></div><button class="btn" data-action="add">创建应用${icons('plus')}</button></article></div><div class="hint-panel">${icons('info')}<div><h3>应用与实例，分别管理</h3><p>停止某个应用不会关闭工作站；关机时统一保存已配置的目录，再释放实例停止计费。所有连接都在客户端内完成。</p></div></div>`}</div>`}
function detail(){const inv=demo.inventory,models=inv.files.filter(f=>f.kind==='模型'),ready=cfg().ready&&!appStopped;return `<div class="app-detail"><div class="scroll-area"><section class="card"><div class="detail-header"><div class="app-logo">${icons('node')}</div><div class="grow"><h2>ComfyUI</h2><p>图像与视频创作 · v${demo.apps[0].version}</p></div>${badge(ready?'运行中':appStopped?'已停止':'等待就绪',ready?'good':'')}</div><div class="detail-facts"><span>${demo.apps[0].plugins} 个插件</span><span>${inv.workflowCount} 个工作流</span><span>随工作站启动</span></div></section><div class="list-header"><h3>模型文件 <span class="tiny muted" style="font-weight:400;margin-left:6px">${models.length} 个 · ${bytes(models.reduce((n,f)=>n+f.size,0))}</span></h3><button class="text-button" data-page="files">全部文件${icons('chevron')}</button></div><p class="tiny muted">${scenario==='off'?'上次扫描快照 · 本次启动后核验':'来自应用保存清单 · 10:42 扫描快照 · 演示数据'}</p><div class="file-list">${models.map(f=>`<div class="file-row"><div class="file-glyph">${f.path.endsWith('.pth')?'PTH':'ST'}</div><div class="grow"><b>${esc(f.path.split('/').pop())}</b><small>${esc(f.path.split('/')[0])} · ${f.source}</small></div><span class="size">${bytes(f.size)}</span>${badge(ready?'本地就绪':'待核验',ready?'good':'')}</div>`).join('')}</div><div class="hint-panel">${icons('folder')}<div><h3>工作流和生成结果，自动保存</h3><p>user / input / output 保存到 Google Drive。模型按清单从 Hugging Face 下载到实例本地盘。</p></div></div></div><aside class="detail-side"><section class="card context-card"><h3>应用入口</h3><code class="access-url">http://127.0.0.1:18188</code><p>由客户端自动建立，连接可用后才能打开。</p><button class="btn primary large" style="width:100%;margin-top:16px" data-action="open-app" ${ready?'':'disabled'}>打开 ComfyUI${icons('arrow')}</button><button class="quiet" style="width:100%;margin-top:5px" data-action="copy-url">${icons('copy')}复制入口</button></section><section class="card context-card" style="margin-top:17px"><h3>启动与保存</h3><div class="setting-line"><span>随工作站启动</span><span class="pill purple">已开启</span></div><div class="setting-line"><span>持久化存储</span><span>Google Drive</span></div><div class="setting-line"><span>文件清单</span><span>动态扫描</span></div><button class="quiet" style="margin-top:12px;width:100%" data-action="toggle-app" ${cfg().ready?'':'disabled'}>${icons(appStopped?'power':'power')}${appStopped?'启动应用':'停止应用'}</button><p class="tiny muted" style="margin-top:8px">停止应用后，实例仍会继续计费。</p></section></aside></div>`}
function files(){const inv=demo.inventory,offline=scenario==='off',cached=offline||inventoryState==='cached';let rows=inv.files.filter(f=>fileFilter==='all'||f.kind===fileFilter);return `<div class="inventory-toolbar"><div class="row"><label for="file-filter">查看</label><select id="file-filter">${[['all','全部文件'],['模型','模型'],['工作流','工作流'],['生成结果','生成结果']].map(([v,t])=>`<option value="${v}" ${fileFilter===v?'selected':''}>${t}</option>`).join('')}</select></div><label for="inventory-mode">清单演示 <select id="inventory-mode"><option value="current" ${inventoryState==='current'?'selected':''}>扫描成功</option><option value="cached" ${inventoryState==='cached'?'selected':''}>缓存快照</option><option value="empty" ${inventoryState==='empty'?'selected':''}>空目录</option><option value="error" ${inventoryState==='error'?'selected':''}>读取失败</option></select></label></div><div class="scroll-area">${scenario==='sync-failed'?alertBanner():''}<div class="directory-bar"><span class="row">${icons('folder')}我的工作站 / ComfyUI</span><span>${cached?'缓存快照 · 非实时状态':'实例扫描结果'} · 演示 · 10:42:08</span></div>${inventoryState==='error'?`<div class="empty">${icons('alert')}<h3>暂时无法读取文件清单</h3><p>读取失败不代表目录为空。上次成功的快照仍然保留。</p><button class="btn" data-action="inventory-retry">重新读取</button></div>`:inventoryState==='empty'?`<div class="empty">${icons('folder')}<h3>这个目录还没有文件</h3><p>应用保存的文件会在下一次扫描时出现。</p></div>`:`<div class="table-card"><table><thead><tr><th>文件名称</th><th>来源 / 目标</th><th>大小</th><th>状态</th></tr></thead><tbody>${rows.map(f=>`<tr><td><div class="file-name">${icons('file')}<span>${esc(f.path.split('/').pop())}</span></div></td><td>${f.source}</td><td class="num">${bytes(f.size)}</td><td>${badge(cached?'待核验':f.state==='ready'?'本地就绪':'已同步',cached?'':'good')}</td></tr>`).join('')}</tbody></table></div><p class="tiny muted" style="margin-top:10px">${rows.length} 项 · ${bytes(rows.reduce((s,f)=>s+f.size,0))} · 当前为设计示例，正式版根据目录扫描结果更新。</p>`}<div class="storage-policies"><section class="policy"><h3>${icons('download')}可重新下载的文件</h3><p>模型与依赖从原始来源下载到实例本地盘，保存来源、版本和校验信息。</p></section><section class="policy"><h3>${icons('shield')}需要保留的文件</h3><p>工作流、配置与生成结果同步到云盘。关机前完成校验，失败时保留实例。</p></section></div></div>`}
function logs(){const errors=(scenario==='failed'?[{time:'10:43:20',kind:'异常',text:'H100 申请失败 · HTTP 503',detail:'Colab 返回暂时不可用，原因未确认。错误会保留，刷新不会把申请失败覆盖成已关机。'}]:scenario==='disconnected'?[{time:'10:43:20',kind:'连接',text:'客户端连接中断',detail:'实例状态与计费待重新确认，未发出关机请求。'}]:scenario==='sync-failed'?[{time:'10:43:20',kind:'异常',text:'同步失败，关机已中止',detail:'2 个文件尚未完成目标端校验，实例继续运行并计费。'}]:[]);return `<div class="tabs" aria-label="记录说明"><span class="tiny muted" style="padding-bottom:13px">本次会话 · 设计示例</span><span class="grow"></span><button data-action="export-log" style="font-size:11px">${icons('download')}导出演示记录</button></div><div class="scroll-area"><div class="log-list">${[...errors,...demo.events].map(e=>`<article class="log-event"><time>${e.time}</time><span class="pill ${e.kind==='异常'?'bad':''}">${e.kind}</span><div class="grow"><h3 style="font-size:12px">${esc(e.text)}</h3><p>${esc(e.detail)}</p></div></article>`).join('')}</div><div class="hint-panel">${icons('info')}<div><h3>状态可以变化，错误记录始终保留。</h3><p>实例、应用、连接和同步分别记录结果；网络中断显示“待确认”，不会被当成“已关机”。</p></div></div></div>`}
function settings(){return `<div class="scroll-area settings"><section class="card"><h3>计算账号</h3><div class="between"><div><strong style="font-size:12px">Google AI Ultra</strong><p>在浏览器中授权，支持选择或切换 Google 账号。</p></div><button class="btn" data-action="account">切换账号${icons('arrow')}</button></div></section><section class="card"><h3>连接与访问</h3><div class="setting-line"><div><strong>客户端自动管理</strong><p>连接、远程执行和重连均在应用内完成。</p></div>${badge('内置连接','purple')}</div><div class="setting-line"><div><strong>应用访问范围</strong><p>局域网共享开启后，同一网络的设备可以访问。</p></div><label><span class="sr-only">应用访问范围</span><select id="access-scope"><option>仅本机</option> <option>本机与局域网</option></select></label></div></section><section class="card"><h3>文件与关机</h3><div class="setting-line"><div><strong>持久化存储</strong><p>按应用隔离保存目录。</p></div><span>Google Drive</span></div><div class="setting-line"><div><strong>同步完成后释放实例</strong><p>同步失败时保留实例并提示，继续计费。</p></div>${badge('默认保护','good')}</div></section><section class="card"><h3>关闭窗口</h3><p>关闭界面不会释放云端实例；实例状态可从系统托盘或菜单栏查看。停止计费请使用“同步并关机”。</p><p style="margin-top:6px">托盘与菜单栏行为为产品设计，当前预览不具备后台进程。</p></section></div>`}
function showDialog(html){lastFocus=document.activeElement;$('dialog').innerHTML=html;$('dialog').showModal()}
function addDialog(kind='service'){const python=kind==='task';showDialog(`<form id="app-form"><div class="dialog-head"><div class="eyebrow">NEW APPLICATION</div><h2 id="dialog-title">${python?'添加 Python 任务':'添加自定义应用'}</h2><p>保存运行方式，启动、日志和文件由工作台统一管理。</p></div><div class="dialog-body"><div class="form-grid"><label class="field full">应用名称<input name="name" required maxlength="40" placeholder="例如：我的图像服务"></label><label class="field full">启动命令<input name="command" class="mono" required maxlength="500" placeholder="${python?'python main.py':'python app.py --port 7860'}"><small>在云端 Linux 实例执行；本设计稿只保存演示配置。</small></label><label class="field ${python?'full':''}">工作目录<input name="directory" class="mono" required pattern="/.*" value="/workspace/my-app"></label>${python?'':`<label class="field">应用端口<input name="port" inputmode="numeric" type="number" min="1" max="65535" required value="7860"></label>`}<label class="field full">需要保存的目录<input name="persist" class="mono" value="output, config" maxlength="500"><small>相对于工作目录，多个目录用逗号分隔。</small></label><label class="checkbox-label field full"><span><input name="auto" type="checkbox" checked> 随工作站启动</span></label></div><p class="form-error" id="form-error" role="alert"></p></div><div class="dialog-footer"><button type="button" class="btn" data-action="close-dialog">取消</button><button type="submit" class="btn primary">保存应用</button></div><input type="hidden" name="kind" value="${kind}"></form>`);$('app-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget),name=f.get('name').trim(),command=f.get('command').trim(),port=Number(f.get('port'));if(!name||!command){$('form-error').textContent='名称和启动命令不能为空。';return}if([...demo.apps,...customApps].some(a=>a.name.toLowerCase()===name.toLowerCase())){$('form-error').textContent='已有同名应用，请换一个名称。';return}if(!python&&[...demo.apps,...customApps].some(a=>a.port===port)){$('form-error').textContent='该端口已被其他应用使用，请更换。';return}customApps.push({id:'custom-'+Date.now(),name,command,directory:f.get('directory'),persist:f.get('persist'),autoStart:f.has('auto'),port:python?null:port,kind,icon:python?'code':'service',subtitle:python?'Python 任务 · 按需运行':`自定义服务 · 端口 ${port}`});$('dialog').close();page='apps';appTab='installed';render();toast('演示配置已添加；没有安装或启动真实应用。')})}
function stopDialog(){showDialog(`<div class="dialog-head"><div class="eyebrow">SAFE SHUTDOWN</div><h2 id="dialog-title">保存文件，然后关机</h2><p>关机将释放 GPU 实例。先结束应用写入、同步文件并确认已保存，再停止计费。</p></div><div class="dialog-body"><div class="shutdown-check">${icons('node')}<div><b>结束正在运行的应用任务</b><small>ComfyUI 及其他已启动的应用</small></div></div><div class="shutdown-check">${icons('folder')}<div><b>同步工作流、配置和生成结果</b><small>按应用的保存目录逐项处理</small></div></div><div class="shutdown-check">${icons('shield')}<div><b>确认保存完成，再释放实例</b><small>同步失败将中止关机，保留实例并继续计费</small></div></div><p id="shutdown-progress" class="form-error" role="status"></p></div><div class="dialog-footer"><button class="btn" data-action="close-dialog">继续运行</button><button class="btn primary" data-action="confirm-stop">同步并关机</button></div>`)}
function doAction(action,target){switch(action){case'refresh':render();toast('已刷新设计示例；没有查询真实实例。');break;case'add':addDialog();break;case'add-python':addDialog('task');break;case'stop':stopDialog();break;case'close-dialog':$('dialog').close();break;case'confirm-stop':{const failure=scenario==='sync-failed';document.querySelectorAll('#dialog button').forEach(b=>b.disabled=true);$('shutdown-progress').textContent='演示：正在同步并校验文件，实例仍在计费…';setTimeout(()=>{$('dialog').close();changeScenario(failure?'sync-failed':'off');toast(failure?'演示：同步未完成，已保留实例。':'演示：文件校验完成，实例已释放。')},1100);break}case'boot':changeScenario('starting');toast('演示启动流程，不申请真实 GPU。');break;case'finish-boot':changeScenario('running');break;case'reconnect':toast('演示：正在重新确认实例与连接状态…');scenarioTimer=setTimeout(()=>changeScenario('running'),1100);break;case'open-app':toast('设计演示：正式版会打开客户端管理的应用入口。');break;case'copy-url':navigator.clipboard?.writeText('http://127.0.0.1:18188').then(()=>toast('已复制演示入口；此设计稿不建立连接。')).catch(()=>toast('演示入口：http://127.0.0.1:18188'));break;case'sync':case'retry-sync':if(syncBusy)return;syncBusy=true;render();toast('演示：正在同步并校验目标文件…');scenarioTimer=setTimeout(()=>{syncBusy=false;if(scenario==='sync-failed')scenario='running';$('scenario').value=scenario;render();toast('演示：同步完成。没有访问真实云盘。')},1100);break;case'inventory-retry':inventoryState='current';render();toast('已重新加载演示清单。');break;case'toggle-app':appStopped=!appStopped;render();toast(`演示：应用已${appStopped?'停止':'启动'}，实例继续运行并计费。`);break;case'account':showDialog(`<div class="dialog-head"><h2 id="dialog-title">连接 Google 账号</h2><p>正式版会在默认浏览器打开 Google 登录页，你可以选择或切换账号。凭据由客户端在本机安全保存。</p></div><div class="dialog-body"><div class="hint-panel" style="margin:0">${icons('info')}<p>这是交互设计稿，本次不会发起真实授权或更改账号。</p></div></div><div class="dialog-footer"><button class="btn primary" data-action="close-dialog">知道了</button></div>`);break;case'custom-info':{const a=customApps.find(a=>a.id===target.dataset.app);if(!a)return;showDialog(`<div class="dialog-head"><h2 id="dialog-title">${esc(a.name)}</h2><p>已保存的演示配置</p></div><div class="dialog-body"><div class="setting-line"><span>启动命令</span><code style="overflow-wrap:anywhere">${esc(a.command)}</code></div><div class="setting-line"><span>工作目录</span><code>${esc(a.directory)}</code></div><div class="setting-line"><span>保存目录</span><code>${esc(a.persist)}</code></div><div class="setting-line"><span>随工作站启动</span><span>${a.autoStart?'是':'否'}</span></div></div><div class="dialog-footer"><button class="btn primary" data-action="close-dialog">完成</button></div>`);break}case'export-log':{const blob=new Blob([JSON.stringify({preview:true,scenario,events:demo.events},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='cloud-deck-demo-log.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('已导出演示记录。');break}}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.platform){document.body.dataset.platform=b.dataset.platform;$('onboarding-link').href='onboarding.html?platform='+b.dataset.platform;document.querySelectorAll('[data-platform].segmented button, .segmented button[data-platform]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));return}if(b.dataset.page){navigate(b.dataset.page);return}if(b.dataset.tab){appTab=b.dataset.tab;page='apps';render();return}if(b.dataset.action)doAction(b.dataset.action,b)});
document.addEventListener('change',e=>{if(e.target.id==='scenario'){changeScenario(e.target.value);return}if(e.target.id==='gpu-select'){selectedGPU=e.target.value;render()}if(e.target.id==='file-filter'){fileFilter=e.target.value;render()}if(e.target.id==='inventory-mode'){inventoryState=e.target.value;render()}if(e.target.id==='access-scope')toast('演示：已选择访问范围，未修改真实连接设置。')});
$('dialog').addEventListener('close',()=>{if(lastFocus?.isConnected)lastFocus.focus()});
const params=new URLSearchParams(location.search);if(Object.hasOwn(titles,params.get('page')))page=params.get('page');if(Object.hasOwn(configs,params.get('state')))scenario=params.get('state');if(params.get('tab')==='templates')appTab='templates';if(params.get('platform')==='mac'){document.body.dataset.platform='mac';document.querySelectorAll('.segmented button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.platform==='mac'))}$('onboarding-link').href='onboarding.html?platform='+document.body.dataset.platform;$('scenario').value=scenario;render();if(params.get('dialog')==='add')addDialog();if(params.get('dialog')==='stop')stopDialog();
</script>
</body>
</html>
