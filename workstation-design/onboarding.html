<script>
'use strict';
const $ = id => document.getElementById(id);
const icon = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const esc = text => String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const google = `<svg class="google-mark" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285f4" d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.61 4.61 0 0 1-1.99 3.03v2.52h3.23c1.89-1.74 2.98-4.3 2.98-7.38Z"/><path fill="#34a853" d="M12 22c2.7 0 4.96-.9 6.62-2.39l-3.23-2.52c-.9.6-2.05.96-3.39.96-2.61 0-4.82-1.76-5.61-4.12H3.05v2.6A10 10 0 0 0 12 22Z"/><path fill="#fbbc05" d="M6.39 13.93A6 6 0 0 1 6.08 12c0-.67.11-1.32.31-1.93v-2.6H3.05A10 10 0 0 0 2 12c0 1.61.39 3.14 1.05 4.53l3.34-2.6Z"/><path fill="#ea4335" d="M12 5.95c1.47 0 2.79.5 3.82 1.49l2.87-2.87A9.61 9.61 0 0 0 12 2a10 10 0 0 0-8.95 5.47l3.34 2.6C7.18 7.71 9.39 5.95 12 5.95Z"/></svg>`;
const accounts = {lin:{name:'Lin',email:'lin@example.com',letter:'L'},studio:{name:'Studio',email:'studio@example.com',letter:'S'}};
const initial = () => ({screen:'welcome',account:'lin',auth:'none',capability:'unknown',instance:'none',app:'stopped',storage:'none',gpu:'G4',reauth:false});
let state = initial(), timer, lastFocus, request = null, requestNumber = 0;
const tag = (text,kind='',glyph='') => `<span class="tag ${kind}">${glyph?icon(glyph):''}${text}</span>`;
const btn = (action,text,primary=false,large=false) => `<button class="btn${primary?' primary':''}${large?' large':''}" data-action="${action}">${text}</button>`;
const note = (text,kind='',glyph='info') => `<div class="note ${kind}">${icon(glyph)}<div>${text}</div></div>`;
const account = () => accounts[state.account];
const workbenchURL = (page='home',mode=state.instance==='none'?'off':state.instance==='unknown'?'disconnected':state.app==='ready'?'running':'starting') => `index.html?platform=${document.body.dataset.platform}&page=${page}&state=${mode}`;
const workbenchLink = (text,page='home',cls='text-btn') => `<a class="${cls}" href="${workbenchURL(page)}">${text}${icon('chevron')}</a>`;
function heading(title,description=''){return `<h1 id="heading" tabindex="-1">${title}</h1>${description?`<p class="intro">${description}</p>`:''}`;}
function accountCard(change=true){const a=account();return `<section class="account-card" aria-label="当前 Google 账号"><div class="avatar">${a.letter}</div><div class="grow"><h2>${a.name}</h2><p>${a.email}</p></div>${change?'<button class="text-btn" data-action="switch-account">换一个账号</button>':tag('Google 已登录','good','check')}</section>`;}
function checkRow(title,description,status,kind='good',glyph='check'){return `<div class="check-row"><span class="check-symbol ${kind==='good'?'':kind}">${icon(glyph)}</span><div class="grow"><h3>${title}</h3><p>${description}</p></div>${tag(status,kind==='neutral'?'':kind)}</div>`;}
function render(focus=true){
 const stage = ['welcome','waiting','cancelled','timeout'].includes(state.screen)?0:['account','restricted','network','expired'].includes(state.screen)?1:state.screen==='setup'?2:3;
 $('steps').innerHTML=[['连接账号','在浏览器选择 Google 账号'],['确认可用','检查 Colab 访问与权益'],['选择应用','确定用途与保存位置'],['开始使用','自动准备，打开应用']].map(([title,detail],i)=>`<li class="step ${i<stage?'done':''}" ${i===stage?'aria-current="step"':''}><span class="step-dot" aria-hidden="true">${i<stage?icon('check'):i+1}</span><div class="step-label"><b>${title}</b><p>${detail}</p></div><span class="sr-only">${i<stage?'已完成':i===stage?'当前步骤':'未开始'}：${title}</span></li>`).join('');
 const known = state.auth==='signed-in'||state.auth==='expired'||state.reauth;
 $('account-button').innerHTML=`<div class="avatar">${known?account().letter:icon('user')}</div><div class="grow"><strong>${known?account().name:'尚未连接账号'}</strong><small>${known?account().email:'在浏览器登录'}</small></div>${icon('chevron')}`;
 const views={welcome,waiting,account:accountView,setup,drive:driveView,'drive-error':driveView,preparing:prepareView,ready:readyView,restricted:accountView,network:accountView,cancelled:errorView,timeout:errorView,expired:errorView};
 $('page').className='page'+(state.screen==='welcome'?' welcome':'');
 $('page').innerHTML=views[state.screen]();
 const instanceLabel=state.instance==='none'?'未申请新实例':state.instance==='unknown'?'状态待确认':'运行中';
 const appLabel=state.instance==='unknown'?'待确认':state.app==='ready'?'就绪':state.app==='preparing'?'准备中':'未启动';
 const storageLabel=state.storage==='ready'?'已连接':state.storage==='error'?'连接失败':state.storage==='cached'?'待核验':'待连接';
 $('status-items').innerHTML=`<span>${icon('cloud')}实例：${instanceLabel}</span><span>${icon('apps')}应用：${appLabel}</span><span>${icon('link')}连接：${state.instance==='none'?'未建立':state.instance==='unknown'?'待确认':'已连接'}</span><span>${icon('folder')}保存：${storageLabel}</span>`;
 $('billing').className='billing'+(state.instance==='none'?' neutral':'');
 $('billing').textContent=state.instance==='none'?'登录不会申请实例':state.instance==='unknown'?'计费待确认 · 云端可能仍在运行':'实例计费中 · 关闭窗口不会关机';
 $('scene').value=state.screen==='preparing'?'drive':state.screen;
 $('original-link').href=workbenchURL();
 if(focus){$('main').scrollTop=0;$('heading')?.focus({preventScroll:true});}
 $('announcement').textContent=$('heading')?.textContent||'';
}
function welcome(){return `<div class="welcome-grid"><section>${heading('使用 Google 登录，<br>直接打开你的应用。','连接你已有的 Colab。环境、连接和文件保存，交给 Cloud Deck 管理。')}<div class="action-row">${btn('login',`${google}使用 Google 账号继续`,false,true)}</div><p class="signin-foot">将在默认浏览器打开，可选择或切换账号。</p><button class="text-btn" style="margin-top:18px" data-action="how">登录后会发生什么${icon('chevron')}</button></section><div class="handoff" role="img" aria-label="流程示意：在 Google 浏览器页面选择账号，授权后回到 Cloud Deck"><div class="browser-card"><div class="browser-top"><i></i><i></i><i></i><div class="address">accounts.google.com · 示意</div></div><div class="browser-content"><div class="row" style="gap:9px">${google}<h3>在浏览器选择账号</h3></div><p class="small muted">使用你自己的 Google 账号</p><div class="browser-account"><div class="avatar">L</div><div>Lin<span>lin@example.com</span></div><span class="grow"></span>${icon('chevron')}</div></div></div><div class="transfer"></div><div class="desk-card"><div class="desk-top">${icon('deck')}Cloud Deck</div><div class="desk-body"><div class="success-glyph">${icon('check')}</div><div><b>账号已连接</b><p>接下来，选择你要运行的应用</p></div></div></div><span class="art-caption">浏览器授权 → 自动回到客户端</span></div></div><div class="welcome-features"><div class="feature">${icon('user')}<h3>账号由你选择</h3><p>沿用现有 Google 账号，<br>无需另注册 Cloud Deck 账号。</p></div><div class="feature">${icon('apps')}<h3>打开应用就能用</h3><p>从 ComfyUI 开始，<br>无需手动运行笔记本。</p></div><div class="feature">${icon('folder')}<h3>文件留在自己的云盘</h3><p>工作流与生成结果保存到 Drive，<br>保存完成后再关机。</p></div></div>`;}
function waiting(){return `<div class="waiting-layout"><section>${heading(state.reauth?'重新连接原来的账号':'请在浏览器完成登录',state.reauth?`请继续使用 ${account().email}，重新确认已有实例与计费状态。`:'选择你的 Google 账号并确认授权，完成后会自动回到这里。')}<div class="wait-label"><span class="spinner" aria-hidden="true"></span>正在等待浏览器返回</div><div class="action-row">${btn('browser',`${icon('browser')}重新打开浏览器`)}<button class="text-btn quiet" data-action="cancel-login">取消本次登录</button></div>${note('浏览器没有自动切回？授权完成后，直接回到 Cloud Deck 窗口即可。')}</section><div class="waiting-icon" aria-hidden="true">${icon('browser')}<span class="circle">${icon('link')}</span></div></div><p class="small muted" style="margin-top:24px">你的密码只在 Google 页面输入。Cloud Deck 不收集 Google 密码。</p>`;}
function accountView(){const blocked=state.screen==='restricted',failed=state.screen==='network';return `${heading(failed?'账号已登录，连接还需确认':blocked?'这个账号暂时还不能启动应用':'账号已连接，可以继续',failed?'暂时没有取得 Colab 的有效结果。重试连接即可，不必重新登录。':blocked?'Google 登录已完成，但当前 Colab 计算权益不满足这种使用方式。':'先确认使用的是你想要的账号。检查账号不会申请 GPU 实例。')}${accountCard()}<div class="checks">${checkRow('Google 账号','已确认账号身份，可以在上方更换。','已登录')}${checkRow('Colab 服务访问',failed?'查询未完成；实例和计费均不能据此判断。':'已取得 Colab 服务访问结果。',failed?'待确认':'已连接',failed?'warn':'good',failed?'alert':'check')}${checkRow('可用计算权益',failed?'等待服务返回结果，不把查询失败当成余额为零。':blocked?'演示：账号没有满足要求的付费权益或可用计算点数。':'演示：已确认付费权益与可用计算点数。',failed?'未核验':blocked?'暂不可用':'可以使用',failed?'neutral':blocked?'warn':'good',failed?'clock':blocked?'alert':'check')}</div>${note(failed?'保留当前登录，连接恢复后可继续。不会申请新实例。':blocked?'Colab 免费档对这类使用有限制。确认你的计算权益，或换一个账号。':'登录完成不会开始计费。只有你确认启动、且 Colab 成功分配实例后，才会开始消耗计算点数。',blocked||failed?'warn':'') }<div class="action-row end">${failed?btn('retry-check',`${icon('refresh')}重新检查`,true):blocked?btn('switch-account','换一个账号',true):btn('setup','选择要运行的应用',true)}${blocked?'<a class="text-btn" href="https://colab.research.google.com/signup" target="_blank" rel="noopener noreferrer">查看 Colab 方案'+icon('arrow')+'</a>':failed?'':`<span class="small muted">下一步设置应用和保存位置</span>`}</div>`;}
function setup(){return `<button class="crumb" data-action="back-account">${icon('back')}返回账号确认</button>${heading('先从一个应用开始','第一次准备完成后，下次打开就能接着使用。')}<div class="setup-app"><div class="app-icon">${icon('node')}</div><div class="grow"><h2>ComfyUI</h2><p>图像与视频创作 · 恢复模型、插件和工作流</p></div>${icon('check')}</div><div class="between" style="margin-top:10px"><span class="small muted">使用已固定的版本与模型清单</span><button class="text-btn" data-action="templates">更多应用模板${icon('chevron')}</button></div><div class="setup-options"><div class="option-row">${icon('chip')}<div class="grow"><h3>使用哪种 GPU</h3><p>列表来自账号可用配置；型号、地区以实际分配为准。</p></div><label><span class="sr-only">GPU 类型</span><select id="gpu">${['G4','L4','A100','H100'].map(v=>`<option ${state.gpu===v?'selected':''}>${v}</option>`).join('')}</select></label></div><div class="option-row">${icon('folder')}<div class="grow"><h3>保存到自己的 Google Drive</h3><p>工作流、配置和生成结果保留在你的云盘。首次启动时可能需要额外授权。</p></div>${tag('启动时连接','','folder')}</div></div>${note('先连接保存位置，再启动应用。模型按已保存的清单直接下载到云端实例，不占用电脑的模型存储空间。','','shield')}<div class="action-row end">${btn('start',`${icon('play')}启动 ComfyUI`,true)}<span class="small muted">启动前会向你确认计费</span></div>`;}
function preparationRows(){return `<div class="prepare-list">${checkRow('分配 GPU 实例',`${esc(state.gpu)} · 已分配，开始消耗计算点数（演示）`,'已完成')}${checkRow('连接保存位置',state.storage==='ready'?'Google Drive 已连接并通过读写检查（演示）':state.storage==='error'?'授权未完成；实例仍然运行，应用尚未启动。':'需要你在浏览器允许连接 Google Drive。',state.storage==='ready'?'已连接':state.storage==='error'?'需重试':'等你授权',state.storage==='ready'?'good':'warn',state.storage==='ready'?'check':'folder')}${checkRow('准备并打开应用',state.app==='preparing'?'恢复环境与文件，随后检查应用入口。':'保存位置可用后，自动恢复应用与连接。',state.app==='preparing'?'准备中':'等待中','neutral',state.app==='preparing'?'refresh':'clock')}</div>`;}
function driveView(){const failed=state.screen==='drive-error';return `${heading(failed?'连接云盘未完成':'再连接一下你的 Google Drive',failed?'应用还没有启动。你可以重试授权，或管理已分配的实例。':'机器已准备好。把保存位置连接好，再开始创作。')}${preparationRows()}<div class="drive-callout">${icon('folder')}<div class="grow"><h3>${failed?'重新在浏览器授权':'由 Google 确认你的云盘权限'}</h3><p>使用 ${account().email} 连接保存空间。Cloud Deck 会把工作流与结果保存到应用目录。</p><div class="action-row">${btn('drive-browser',`${icon('browser')}${failed?'重试连接 Drive':'在浏览器连接 Drive'}`,true)}</div></div></div>${note('等待授权期间，实例仍会消耗计算点数。如果暂时不继续，请到工作台保存并关机。','warn')}<div class="action-row end">${workbenchLink('管理已分配实例')}<span class="small muted">关闭窗口不会释放实例</span></div>`;}
function prepareView(){return `${heading('正在准备你的 ComfyUI','云盘已连接，接下来自动恢复环境、建立入口并检查应用状态。')}${preparationRows()}<div class="wait-label"><span class="spinner" aria-hidden="true"></span>正在检查应用入口（演示）</div>${note('实例已经开始计费。准备期间可以留在这里查看进度。','warn')}`;}
function readyView(){return `<div class="ready-banner">${icon('check')}首次准备完成</div>${heading('准备好了，开始创作吧。','之后可以直接从工作台启动应用，继续上次的工作。')}<section class="ready-app"><div class="row"><div class="app-icon">${icon('node')}</div><div class="grow"><h2>ComfyUI</h2><p>应用运行中，访问连接已就绪</p></div>${tag('可打开','good','check')}</div><div class="ready-details"><span>${icon('chip')}<strong>${esc(state.gpu)} GPU</strong></span><span>${icon('folder')}Google Drive 已连接</span><span>${icon('link')}仅本机访问</span></div><div class="action-row">${btn('open-app',`打开 ComfyUI${icon('arrow')}`,true,true)}${workbenchLink('进入完整工作台')}</div></section><div class="next-links">${workbenchLink('查看文件与同步','files')}${workbenchLink('添加其他应用','apps')}</div>${note('用完后，在工作台选择“同步并关机”。保存完成并确认实例释放后，才能确认停止计费。','','shield')}<div class="action-row end"><span class="small muted">当前使用 ${account().email}</span><button class="text-btn" data-action="account-menu">管理账号</button></div>`;}
function errorView(){const expired=state.screen==='expired',timeout=state.screen==='timeout';return `<section class="error-content"><div class="error-glyph">${icon(expired?'shield':timeout?'clock':'user')}</div>${heading(expired?'重新登录，接回你的工作台':timeout?'这次登录等待已超时':'这次还没有完成登录',expired?'Google 授权已失效。重新连接原来的账号后，再确认云端实例和文件状态。':timeout?'本次登录请求已失效。重新开始即可选择账号，旧页面的返回不会继续这次登录。':'你取消了本次授权。准备好后，可以重新在浏览器选择 Google 账号。')}${expired?`<div class="help-lines"><strong>${account().email}</strong><br>上次记录：实例运行中 · ComfyUI 已启动<br>当前状态：待确认，云端可能继续计费</div>`:''}<div class="action-row">${btn(expired?'reauth':'login',`${google}${expired?'重新连接原账号':'重新开始登录'}`,true)}${expired?workbenchLink('查看上次的工作台'):'<button class="text-btn quiet" data-action="welcome">返回欢迎页</button>'}</div>${note(expired?'登录失效不代表实例已关机。上次的文件快照和活动记录会继续保留。':'这次登录没有申请实例，也没有启动云端应用。',expired?'warn':'')}</section>`;}
function showDialog(content){lastFocus=document.activeElement;$('dialog').innerHTML=content;if(!$('dialog').open)$('dialog').showModal();}
function closeDialog(){$('dialog').close();}
function modal(title,description,body,footer){showDialog(`<div class="dialog-head"><div class="between"><h2 id="dialog-title">${title}</h2><button class="modal-close" data-action="close" aria-label="关闭对话框">${icon('close')}</button></div><p>${description}</p></div><div class="dialog-body">${body}</div><div class="dialog-footer">${footer}</div>`);}
function invalidate(){request=null;clearTimeout(timer);requestNumber++;}
function beginLogin(reauth=false){invalidate();state.reauth=reauth;state.auth='pending';state.screen='waiting';request={id:requestNumber,purpose:reauth?'reauth':'login'};render();browserDialog();}
function browserDialog(){if(!request)return;const drive=request.purpose==='drive',reauth=request.purpose==='reauth';const purpose=drive?'连接 Google Drive':reauth?'重新连接原账号':'选择 Google 账号';showDialog(`<div class="dialog-head"><div class="demo-label">${icon('browser')}浏览器流程示意 · 不是 Google 登录页面</div><div class="between"><h2 id="dialog-title">${purpose}</h2><button class="modal-close" data-action="close" aria-label="暂时返回客户端">${icon('close')}</button></div><p>正式版会打开系统默认浏览器，由 Google 完成登录与授权。</p></div><div class="dialog-body"><div class="browser-note">这是可交互设计稿，不访问 Google，不收集密码，不改变任何真实授权。</div>${(drive||reauth?[state.account]:Object.keys(accounts)).map(key=>{const a=accounts[key];return `<label class="account-choice"><div class="avatar">${a.letter}</div><div><strong>${a.name}</strong><small>${a.email} · 虚构账号</small></div><input type="radio" name="demo-account" value="${key}" ${key===state.account?'checked':''} aria-label="${a.name} ${a.email}"></label>`}).join('')}${note(drive?'演示授权结果：当前实例可以连接你的 Drive 保存目录。正式版显示 Google 实际请求的范围，并在返回后检查读写能力。':reauth?'重新登录后会再次查询已有实例，不会创建新的实例。':'返回后会分别确认身份、Colab 访问和计算权益。这里的成功结果均为演示。')}</div><div class="dialog-footer">${btn('deny-browser','模拟取消授权')}${btn('accept-browser','模拟授权并返回',true)}</div>`);}
function completeBrowser(){if(!request)return;const purpose=request.purpose;const selected=document.querySelector('[name="demo-account"]:checked')?.value;if(!Object.hasOwn(accounts,selected))return;closeDialog();invalidate();if(purpose==='drive'){state.storage='ready';state.app='preparing';state.screen='preparing';render();const generation=requestNumber;timer=setTimeout(()=>{if(generation!==requestNumber)return;state.app='ready';state.screen='ready';render();},1400);return;}state.account=selected;state.auth='signed-in';state.capability='ready';if(purpose==='reauth'){state.reauth=false;state.instance='running';state.app='ready';state.storage='ready';state.screen='ready';}else state.screen='account';render();}
function cancelLogin(){closeDialog();invalidate();if(state.reauth){state.auth='expired';state.screen='expired';state.reauth=false;}else{state.auth='none';state.screen='cancelled';}render();}
function loadScene(name){if(!Array.from($('scene').options).some(o=>o.value===name))name='welcome';closeDialog();invalidate();state=initial();state.screen=name;if(['account','setup','drive','drive-error','ready','restricted','network'].includes(name)){state.auth='signed-in';state.capability=name==='restricted'?'restricted':name==='network'?'error':'ready';}if(['drive','drive-error','ready'].includes(name)){state.instance='running';state.storage=name==='ready'?'ready':name==='drive-error'?'error':'awaiting';state.app=name==='ready'?'ready':'stopped';}if(name==='expired'){state.auth='expired';state.instance='unknown';state.app='unknown';state.storage='cached';}if(name==='waiting'){state.auth='pending';request={id:requestNumber,purpose:'login'};}render();}
function accountMenu(){const active=state.instance!=='none';const known=state.auth==='signed-in'||state.auth==='expired'||state.reauth;modal(known?'账号与工作空间':'连接 Google 账号',known?account().email:'使用你自己的账号，不需要另注册 Cloud Deck 账号。',active?note('这个账号仍有运行中或待确认的实例。先确认机器状态，再保存并关机，之后才能切换或退出。','warn'):`<p class="small muted">${known?'本次尚未申请实例，可以重新选择账号。':'登录在系统浏览器中完成，你可以自行选择账号。'}</p>`,active?`${btn('close','继续使用当前账号')}${workbenchLink('前往工作台处理','home','btn primary')}`:`${btn('close','取消')}${btn('switch-account',known?'切换账号':'连接账号',true)}`);}
function action(name){switch(name){
 case'login':beginLogin();break;
 case'reauth':beginLogin(true);break;
 case'browser':browserDialog();break;
 case'cancel-login':cancelLogin();break;
 case'accept-browser':completeBrowser();break;
 case'deny-browser':if(request?.purpose==='drive'){closeDialog();invalidate();state.storage='error';state.screen='drive-error';render();}else cancelLogin();break;
 case'switch-account':if(state.instance!=='none'){accountMenu();break;}closeDialog();beginLogin();break;
 case'account-menu':accountMenu();break;
 case'welcome':loadScene('welcome');break;
 case'close':closeDialog();break;
 case'how':modal('从登录到使用，只需几步','首次设置后，正常情况下可以直接回到你的工作台。',`<div class="checks">${checkRow('在 Google 页面选择账号','密码只在 Google 页面输入。','浏览器','','browser')}${checkRow('确认账号的计算权益','免费档不一定支持这种使用方式；按 Colab 真实结果判断。','客户端','','cloud')}${checkRow('选择应用，确认后启动','首次连接 Drive 可能需要额外授权；分配成功即可能计费。','你来确认','','play')}</div>`,btn('close','明白了',true));break;
 case'retry-check':state.capability='ready';state.screen='account';render();break;
 case'setup':if(state.auth!=='signed-in'||state.capability!=='ready')break;state.screen='setup';render();break;
 case'back-account':state.screen='account';render();break;
 case'templates':modal('ComfyUI 是第一个应用','同一台工作站还可以运行你的脚本和服务。',`<div class="checks">${checkRow('ComfyUI','使用已有固定版本、模型与工作流配置。','已选择','good','node')}${checkRow('Python 任务 / 自定义服务','先在工作台添加启动方式与保存目录，再运行。','需要配置','neutral','apps')}</div>`,`${btn('close','继续设置 ComfyUI',true)}<a class="btn" href="${workbenchURL('apps')}&tab=templates">浏览应用模板</a>`);break;
 case'start':if(state.auth!=='signed-in'||state.capability!=='ready'||state.instance!=='none')break;modal('启动 ComfyUI 工作站','确认后，将为当前账号申请 GPU 实例。',`<div class="option-row"><span class="muted">Google 账号</span><span class="grow"></span><span>${account().email}</span></div><div class="option-row"><span class="muted">申请配置</span><span class="grow"></span><span>${esc(state.gpu)} · 地区按分配结果</span></div><div class="option-row"><span class="muted">保存位置</span><span class="grow"></span><span>Google Drive · 启动时连接</span></div>${note('实例分配成功后就开始消耗计算点数，包括准备应用和等待云盘授权的时间。关闭窗口不会停止计费。','warn')}`,`${btn('close','暂不启动')}${btn('confirm-start','确认并启动',true)}`);break;
 case'confirm-start':if(state.auth!=='signed-in'||state.capability!=='ready'||state.instance!=='none')break;closeDialog();invalidate();state.instance='running';state.storage='awaiting';state.screen='drive';render();break;
 case'drive-browser':if(state.instance!=='running'||state.app==='ready')break;invalidate();request={id:requestNumber,purpose:'drive'};browserDialog();break;
 case'open-app':modal('应用入口已就绪','这是打开应用的设计演示，尚未连接真实 ComfyUI。',`<p class="small muted">正式版会在浏览器打开客户端建立的本机入口。连接检查通过后才允许打开。</p><div class="url-example">http://127.0.0.1:18188</div>`,`${btn('close','返回')}${workbenchLink('查看应用工作台','detail','btn primary')}`);break;
}}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;if(b.dataset.platform){document.body.dataset.platform=b.dataset.platform;document.querySelectorAll('.platform button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('original-link').href=workbenchURL();document.querySelectorAll('a[href^="index.html?"]').forEach(a=>{const u=new URL(a.href);u.searchParams.set('platform',b.dataset.platform);a.href=u.href;});return;}if(b.dataset.action)action(b.dataset.action);});
document.addEventListener('change',event=>{if(event.target.id==='scene')loadScene(event.target.value);if(event.target.id==='gpu'&&['G4','L4','A100','H100'].includes(event.target.value))state.gpu=event.target.value;});
$('dialog').addEventListener('close',()=>{if(lastFocus?.isConnected)lastFocus.focus();});
const params=new URLSearchParams(location.search);if(params.get('platform')==='mac'){document.body.dataset.platform='mac';document.querySelectorAll('.platform button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.platform==='mac')));}loadScene(params.get('screen')||'welcome');
</script>
</body>
</html>
