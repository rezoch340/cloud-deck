# 推送 v* 版本标签时自动编译 Windows (x64 NSIS & Portable) 安装包并发布 GitHub Release（macOS 包由本机自行构建）；支持手动触发演练构建。
name: Release Desktop Client

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '演练构建版本号（如 0.1.0；手动触发仅上传构建产物，不创建正式 Release）'
        required: false
        default: '0.1.0'

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows (x64 NSIS & Portable)
    runs-on: windows-latest
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
          run_install: false
          standalone: true

      - name: 安装 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 Rust 稳定版工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 准备工作目录与同步版本号
        id: version
        shell: pwsh
        env:
          RAW_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || '0.1.0' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $workRoot = Join-Path $env:RUNNER_TEMP "cloud-deck-work"
          New-Item -ItemType Directory -Force -Path $workRoot | Out-Null
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME ".cargo" }
          $rustupHome = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $HOME ".rustup" }
          "CLOUD_DECK_WORK_ROOT=$workRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_HOME=$cargoHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTUP_HOME=$rustupHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          node client/scripts/sync-version.mjs "$env:RAW_VERSION" --github-output
          node client/scripts/sync-version.mjs "$env:RAW_VERSION" --check

      - name: 安装依赖并运行前后端测试
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node client/scripts/run.mjs install
          node client/scripts/run.mjs test
          node client/scripts/run.mjs rust-test

      - name: 构建 Windows NSIS 安装包
        run: node client/scripts/run.mjs desktop-build --bundles nsis

      - name: 检查发行程序的内嵌界面
        shell: pwsh
        run: |
          $binaryPath = Join-Path $env:CLOUD_DECK_WORK_ROOT "build\cloud-deck\client\target\release\cloud-deck.exe"
          $checkProcess = Start-Process -FilePath $binaryPath -ArgumentList "--check-frontend-assets" -Wait -PassThru
          if ($checkProcess.ExitCode -ne 0) {
            throw "发行程序没有正确嵌入首页与 JS/CSS，停止发布。"
          }

      - name: 整理 Windows 发行产物
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $releaseDir = Join-Path $env:CLOUD_DECK_WORK_ROOT "build\cloud-deck\client\target\release"
          $nsisDir = Join-Path $releaseDir "bundle\nsis"
          $setupExe = Get-ChildItem -Path $nsisDir -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $setupExe) {
            throw "未找到 NSIS 安装包产物：$nsisDir"
          }
          $distDir = Join-Path $env:RUNNER_TEMP "release-assets-windows"
          $portableStage = Join-Path $env:RUNNER_TEMP "portable-stage\CloudDeck-$env:RELEASE_VERSION-windows-x64"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          New-Item -ItemType Directory -Force -Path $portableStage | Out-Null

          Copy-Item $setupExe.FullName (Join-Path $distDir "CloudDeck-$env:RELEASE_VERSION-windows-x64-setup.exe")
          Copy-Item (Join-Path $releaseDir "cloud-deck.exe") (Join-Path $portableStage "Cloud Deck.exe")
          if (Test-Path (Join-Path $releaseDir "WebView2Loader.dll")) {
            Copy-Item (Join-Path $releaseDir "WebView2Loader.dll") $portableStage
          }
          if (Test-Path (Join-Path $releaseDir "cloud")) {
            Copy-Item -Recurse (Join-Path $releaseDir "cloud") (Join-Path $portableStage "cloud")
          }
          Compress-Archive -Path "$portableStage\*" -DestinationPath (Join-Path $distDir "CloudDeck-$env:RELEASE_VERSION-windows-x64-portable.zip") -Force

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: assets-windows
          path: ${{ runner.temp }}/release-assets-windows/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部平台产物
        uses: actions/download-artifact@v4
        with:
          path: release-Input
          merge-multiple: true

      - name: 生成 SHA256SUMS.txt
        run: |
          cd release-Input
          sha256sum CloudDeck-* | tee SHA256SUMS.txt

      - name: 归档完整发行包与校验清单
        uses: actions/upload-artifact@v4
        with:
          name: cloud-deck-release-bundle
          path: release-Input/*
          if-no-files-found: error

      - name: 发布正式 GitHub Release（仅限 v* 标签推送）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Cloud Deck ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-Input/CloudDeck-*
            release-Input/SHA256SUMS.txt
